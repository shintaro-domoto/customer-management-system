
services:
  api: #fastapi用コンテナを作成なのでapiと命名
    build: #Dockerfileから作成
      context: . #Dockerビルド時にDockerfileが参照できるファイルの範囲　※ビルド＝dockerfileからdockerイメージを作成すること
      dockerfile: Dockerfile
    container_name: customer-management-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db


  db:
    image: postgres:17

    container_name: customer-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

  